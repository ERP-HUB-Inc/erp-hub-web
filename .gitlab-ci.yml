image: keymetrics/pm2:6

stages:
  - deploy

deploy_prod:
  stage: deploy
  script:
    - echo "====== Deploy to production server ======"
    - apk update && apk upgrade
    - apk add git openssh bash
    # Add target server`s secret key
    #- mkdir ~/.ssh
    #- echo /root/.ssh/id_rsa | base64 -d > ~/.ssh/id_rsa
    #- chmod 700 ~/.ssh && chmod 600 ~/.ssh/*
    - sshpass -V
    - export SSHPASS=@bC*123
    - sshpass -e scp -o stricthostkeychecking=no -r . root@178.128.61.100:/var/www/html
    - echo "Test ssh connection"
    - ssh -o StrictHostKeyChecking=no -T "root@178.128.61.100"
    # Delploy
    - echo "Setup tagget server directories"
    - pm2 deploy ecosystem.config.js production setup 2>&1 || true
    - echo "make deploy"
    - pm2 deploy ecosystem.config.js production
  environment:
    name: deploying
  only:
  - master